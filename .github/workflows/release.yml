name: Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Tag Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install depepndencies
        run: sudo apt-get install -y zip jq


      - name: Update Info.json Version
        run: |
          jq --arg VERSION "${{ env.VERSION }}" '.version = $VERSION | .ghVersion += 1' Info.json > tmp.$$.json
          mv tmp.$$.json Info.json
          git add Info.json

      - name: Commit Version Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --staged --quiet; then
            git commit -m "Update plugin version to ${{ env.VERSION }} [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          else
            echo "No Info.json files updated, skipping commit."
          fi

      - name: Package Plugin
        run: |
          mkdir -p release-assets
          zip -r "release-assets/playlist-sort.iinaplgz" Info.json main.js README.md help.html LICENSE
          unzip -l release-assets/playlist-sort.iinaplgz

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} release-assets/playlist-sort.iinaplgz --clobber
